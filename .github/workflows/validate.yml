name: Validate landing
on:
  push:
    branches: [codex/app-download-smart-link]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/app-links.test.mjs
      - run: npm run lint
      - run: npm run build
